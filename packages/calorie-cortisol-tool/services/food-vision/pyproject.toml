[tool.poetry]
name = "food-vision"
version = "0.1.0"
description = "Food Vision Service (Python/FastAPI + Triton) for the Calorie & Cortisol Tool"
authors = ["Calorie & Cortisol Tool Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
pydantic = "^2.7"
uvicorn = "^0.30"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
hypothesis = "^6.100"
ruff = "^0.4"
black = "^24.4"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

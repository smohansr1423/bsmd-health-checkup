[tool.poetry]
name = "insights-ml"
version = "0.1.0"
description = "Insights & ML Service (Python/FastAPI + SageMaker + LLM) for the Calorie & Cortisol Tool"
authors = ["Calorie & Cortisol Tool Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
cc-contracts = { path = "../../shared/python", develop = true }
fastapi = "^0.115"
pydantic = "^2.7"
uvicorn = "^0.30"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
hypothesis = "^6.100"
ruff = "^0.4"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
